name: Story animatic

on:
  workflow_dispatch:
    inputs:
      script:
        description: Markdown script inside story_scripts/
        required: true
        default: story_scripts/01-nhung-hoi-kin-tung-lam-mua-lam-gio-o-viet-nam.md
        type: string
      mode:
        description: Render first 10 scenes or all scenes
        required: true
        default: test
        type: choice
        options:
          - test
          - full

permissions:
  contents: read

concurrency:
  group: story-animatic-${{ github.ref }}-${{ inputs.script }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: template/package-lock.json
      - name: Validate and prepare story props
        run: node scripts/parse-story.mjs --script="${{ inputs.script }}" --mode="${{ inputs.mode }}" --output=template/out/story-props.json
      - name: Install renderer
        working-directory: template
        run: npm ci
      - name: Render MP4 animatic
        working-directory: template
        run: npx remotion render src/index.ts StoryAnimatic out/story-animatic.mp4 --props=out/story-props.json --codec=h264 --concurrency=2
      - name: Upload MP4 and render props
        uses: actions/upload-artifact@v4
        with:
          name: story-animatic-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            template/out/story-animatic.mp4
            template/out/story-props.json
          if-no-files-found: error
          retention-days: 14
