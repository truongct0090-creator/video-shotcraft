name: PR checks

# Catches problems BEFORE merge that deploy-pages.yml would only surface after:
# generated artifacts (gallery/source, library.json, index.html, sitemap,
# llms.txt) drifting from the shot cards, and library.json referencing preview
# MP4s that don't exist on the gallery-media release.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'references/shots/**'
      - 'gallery/**'
      - 'demos/**'
      - 'assets/lib/**'
      - 'assets/scripts/**'
      - 'scripts/validate-animation-workshop.mjs'
      - 'scripts/validate-rendered-film.mjs'
      - 'scripts/fetch-story-reference-images.mjs'
      - 'scripts/qa-rendered-film.mjs'
      - 'story_scripts/**'
      - 'ANIMATION_WORKSHOP.md'
      - 'template/src/**'
      - 'workbench/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pr-checks.yml'

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freesound-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freesound sourcing offline regressions
        run: python3 -m unittest discover -s assets/scripts -p 'test_sfx_source.py' -v

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Helpers pure functions unit tests
        run: |
          npm ci
          npm test

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generated artifacts are in sync with cards
        run: |
          python3 gallery/sync-from-cards.py
          python3 gallery/build-seo.py
          # git status --porcelain (not diff --exit-code): a brand-new card's
          # regenerated source copy is UNTRACKED, which diff can't see — that's
          # exactly the "added a card, forgot to commit the copy" mistake this
          # gate exists to catch.
          if [ -n "$(git status --porcelain -- gallery)" ]; then
            git status --porcelain -- gallery
            echo '::error::gallery artifacts drift from cards — run' \
                 'sync-from-cards.py + build-seo.py and commit the result'
            exit 1
          fi

      - name: Voiceover tail-trim regression tests
        run: python3 scripts/test_voiceover_trim.py -v

      - name: Asset-first animation workshop inventory
        run: node scripts/validate-animation-workshop.mjs --output=/tmp/animation-asset-audit.json

      - name: Parse and validate all story scene props
        run: |
          node scripts/parse-story.mjs --script=story_scripts/02-sau-canh-cua-bi-mat.md --mode=full --output=/tmp/story-props.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/story-props.json', encoding='utf-8'))
          scenes = data.get('scenes', [])
          assert len(scenes) == 20, f'expected 20 scenes, got {len(scenes)}'
          missing = [s.get('number') for s in scenes if not s.get('props')]
          assert not missing, f'missing scene props: {missing}'
          print(f'validated {len(scenes)} scenes with explicit visual props')
          PY

      - name: Every library.json preview exists on the gallery-media release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The gallery preview release is an optional, separately maintained asset bundle.
          # Keep validating every asset when the release exists, but don't block unrelated
          # source/template PRs when this repository has not published that bundle yet.
          if ! gh release view gallery-media --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::gallery-media release is not published; preview-file verification was skipped. Publish the release before deploying the gallery."
            exit 0
          fi
          # 与 deploy-pages 同一套组装（整包 zip + 晚于它的单个 mp4），查的是部署时真正拿到的文件
          python3 gallery/assemble-media.py /tmp/gallery-media
          python3 - <<'EOF'
          import json, os, re, sys
          lib = json.load(open('gallery/api/library.json'))
          assets = set(os.listdir('/tmp/gallery-media'))
          missing, malformed = [], []
          # app.js interpolates these URLs into innerHTML without escaping,
          # so gate the exact shape here: same-origin relative ./media/ path
          # only — no absolute/protocol-relative URLs, no quotes/angle brackets
          CANONICAL = re.compile(r'^\./media/[a-z0-9-]+\.(mp4|gif)(\?v=\d+)?$')
          for card in lib['cards']:
              for style in card['styles']:
                  media = style.get('media')
                  url = media.get('url') if isinstance(media, dict) else media
                  if not url:
                      continue
                  if not CANONICAL.match(url):
                      malformed.append(f"{card['name']}/{style['key']}: {url}")
                      continue
                  name = url.split('?')[0].rstrip('/').split('/')[-1]
                  if name not in assets:
                      missing.append(f"{card['name']}/{style['key']}: {name}")
          if malformed:
              print('::error::non-canonical media URLs (must be ./media/<name>.mp4?v=N):')
              print(*malformed, sep='\n  ')
              sys.exit(1)
          if missing:
              print('::error::previews missing from the gallery-media release:')
              print(*missing, sep='\n  ')
              sys.exit(1)
          print(f"all previews present on release "
                f"({len(lib['cards'])} cards checked)")
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: template/package-lock.json

      - name: Demo components compile (tsc strict)
        run: |
          cd template && npm ci
          # 4 current demos + 2 legacy snapshots import @remotion/motion-blur, which the template
          # deliberately doesn't ship. Install it transiently, pinned to the
          # template's remotion version — a bare latest install nests a second
          # remotion copy and trips checkMultipleRemotionVersions.
          npm i --no-save "@remotion/motion-blur@$(node -p "require('./package.json').dependencies.remotion")"
          # demos/ live outside template/, so give tsc a module-resolution
          # root at the repo top via a transient symlink
          cd .. && ln -s template/node_modules node_modules
          find demos -name '*.tsx' | sed 's|^|./|' > /tmp/demo-files.txt
          # assets/lib components that only need remotion also get compiled.
          # (three-dependent ones — FlatPanel, helpers/camera — are excluded
          # because the template doesn't ship three.)
          for f in assets/lib/ClipCard.tsx assets/lib/Caption.tsx \
                   assets/lib/DigitRoll.tsx assets/lib/FlashCut.tsx \
                   assets/lib/PageCam.tsx assets/lib/VerticalTicker.tsx \
                   assets/lib/helpers/motion.ts assets/lib/helpers/rand.ts \
                   assets/lib/helpers/shake.ts; do
            echo "./$f" >> /tmp/demo-files.txt
          done
          echo "checking $(wc -l < /tmp/demo-files.txt | tr -d ' ') tsx files"
          ./node_modules/.bin/tsc --noEmit --strict --skipLibCheck \
            --esModuleInterop --jsx react-jsx --target es2022 \
            --module esnext --moduleResolution bundler --lib dom,es2022 \
            --resolveJsonModule \
            $(cat /tmp/demo-files.txt)

  workbench-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - name: Workbench type-checks and bundles with all demos linked in
        run: |
          cd workbench
          # prepare hook builds the active index and the hidden compatibility index
          npm ci
          npx tsc -b
          npx vite build
      - name: Template (incl. workbench manifest) compiles against the workbench toolchain
        run: |
          # template/ has no node_modules in CI; borrow the workbench's (same remotion / react pins)
          ln -s ../workbench/node_modules template/node_modules
          # Reusable film components imported from assets/lib resolve packages from the repo root.
          ln -s workbench/node_modules node_modules
          cd template && ../workbench/node_modules/.bin/tsc --noEmit -p tsconfig.json
      - name: Theme and palette regressions
        run: npm --prefix workbench run test:themes
      - name: Export errors and Python interpreter regressions
        run: npm --prefix workbench run test:platform
      - name: Retired demos remain compatible with saved projects
        run: npm --prefix workbench run test:legacy

  demo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: template/package-lock.json
      - name: Render first frame of every runnable demo
        run: |
          cd template && npm ci
          npm i --no-save "@remotion/motion-blur@$(node -p "require('./package.json').dependencies.remotion")"
          cd ..
          # Generated smoke roots import demos outside template/. Make the
          # template dependencies resolvable from those source directories.
          ln -s template/node_modules node_modules
          python3 assets/scripts/smoke-render-demos.py

  story-visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: template/package-lock.json
      - name: Install FFmpeg for rendered MP4 QA
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version
      - name: Cache verified historical reference images
        uses: actions/cache@v4
        with:
          path: template/public/reference
          key: story-reference-images-v2
      - name: Fetch allow-listed archival references
        run: node scripts/fetch-story-reference-images.mjs
      - name: Parse first 10 scenes
        run: node scripts/parse-story.mjs --script=story_scripts/01-nhung-hoi-kin-tung-lam-mua-lam-gio-o-viet-nam.md --mode=test --output=template/out/story-props.json
      - name: Render illustrated film smoke test
        working-directory: template
        run: |
          npm ci
          npx remotion render src/index.ts IllustratedStoryFilm out/story-film-smoke.mp4 --props=out/story-props.json --codec=h264 --concurrency=2
      - name: Validate rendered film
        run: node scripts/validate-rendered-film.mjs --file=template/out/story-film-smoke.mp4 --props=template/out/story-props.json --output=template/out/story-film-smoke-qa.json
      - name: Upload smoke-test render
        uses: actions/upload-artifact@v4
        with:
          name: story-film-visual-smoke
          path: |
            template/out/story-film-smoke.mp4
            template/out/story-film-smoke-qa.json
          if-no-files-found: error
          retention-days: 7
