name: Chibi cartoon demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render chibi demo with Remotion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: template/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install template dependencies
        working-directory: template
        run: npm ci

      - name: Render chibi demo
        working-directory: template
        run: npx remotion render src/index.ts ChibiDemo out/chibi-demo.mp4 --concurrency=1

      - name: Verify MP4
        run: ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 template/out/chibi-demo.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: chibi-cartoon-demo
          path: template/out/chibi-demo.mp4
          if-no-files-found: error
          retention-days: 7
